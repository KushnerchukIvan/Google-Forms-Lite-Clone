enum QuestionType {
  TEXT
  MULTIPLE_CHOICE
  CHECKBOX
  DATE
}

type Option {
  id: ID!
  label: String!
}

type Question {
  id: ID!
  title: String!
  type: QuestionType!
  required: Boolean!
  options: [Option!]!
  order: Int!
}

type Form {
  id: ID!
  title: String!
  description: String!
  questions: [Question!]!
  createdAt: String!
}

type Answer {
  questionId: ID!
  value: [String!]!
}

type Response {
  id: ID!
  formId: ID!
  answers: [Answer!]!
  submittedAt: String!
}

input OptionInput {
  id: ID!
  label: String!
}

input QuestionInput {
  id: ID!
  title: String!
  type: QuestionType!
  required: Boolean!
  options: [OptionInput!]!
  order: Int!
}

input AnswerInput {
  questionId: ID!
  value: [String!]!
}

type Query {
  forms: [Form!]!
  form(id: ID!): Form
  responses(formId: ID!): [Response!]!
}

type Mutation {
  createForm(
    title: String!
    description: String
    questions: [QuestionInput!]!
  ): Form!
  submitResponse(formId: ID!, answers: [AnswerInput!]!): Response!
}
